name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Runs after Windows so a failed Windows build cannot leave a release
    # published with Linux archives alone. GitHub sorts the asset list
    # alphabetically whatever the upload order, so the notes are what actually
    # points people at the right download.
    needs: windows
    strategy:
      matrix:
        include:
          - goarch: amd64
            archive_arch: x86_64
          - goarch: arm64
            archive_arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build static binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/pictogrep .
          cp dist/pictogrep pictogrep-linux-${{ matrix.archive_arch }}
          if [ "$GOARCH" = amd64 ]; then
            . scripts/gallery-dl-version.sh
            curl --fail --location --proto '=https' --tlsv1.2 \
              "https://codeberg.org/mikf/gallery-dl/releases/download/v${GALLERY_DL_VERSION}/gallery-dl.bin" \
              -o dist/gallery-dl
            chmod 755 dist/gallery-dl
            dist/gallery-dl --version | grep -F "$GALLERY_DL_VERSION"
            tar -C dist -czf pictogrep-linux-${{ matrix.archive_arch }}.tar.gz pictogrep gallery-dl
          else
            tar -C dist -czf pictogrep-linux-${{ matrix.archive_arch }}.tar.gz pictogrep
          fi
          sha256sum pictogrep-linux-${{ matrix.archive_arch }}.tar.gz > pictogrep-linux-${{ matrix.archive_arch }}.tar.gz.sha256
      - name: Install ARM64 emulator
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Smoke test standalone archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GOARCH" = amd64 ]; then EXPECTED_FILES=2; else EXPECTED_FILES=1; fi
          test "$(tar -tzf pictogrep-linux-${{ matrix.archive_arch }}.tar.gz | wc -l)" -eq "$EXPECTED_FILES"
          mkdir unpacked
          tar -xzf pictogrep-linux-${{ matrix.archive_arch }}.tar.gz -C unpacked
          if [ "$GOARCH" = arm64 ]; then RUNNER=qemu-aarch64-static; else RUNNER=; fi
          $RUNNER unpacked/pictogrep version | grep "${GITHUB_REF_NAME#v}"
          if [ "$GOARCH" = amd64 ]; then unpacked/gallery-dl --version; fi
          TEST_ROOT="$(mktemp -d)"
          XDG_DATA_HOME="$TEST_ROOT/share" $RUNNER unpacked/pictogrep install-desktop
          test -s "$TEST_ROOT/share/applications/pictogrep.desktop"
          test -s "$TEST_ROOT/share/icons/hicolor/512x512/apps/pictogrep.png"
          PICTOGREP_HOME="$TEST_ROOT/home" BROWSER=true $RUNNER unpacked/pictogrep &
          APP_PID=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/app/state > /dev/null && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/api/app/state | grep '"aiAvailable":true'
          kill "$APP_PID"
          wait "$APP_PID" || true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            pictogrep-linux-${{ matrix.archive_arch }}
            pictogrep-linux-${{ matrix.archive_arch }}.tar.gz
            pictogrep-linux-${{ matrix.archive_arch }}.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          $version = "${{ github.ref_name }}".TrimStart("v")
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.version=$version" -o dist/pictogrep.exe .
      - name: Bundle Pinterest importer
        shell: pwsh
        run: |
          $line = Get-Content scripts/gallery-dl-version.sh | Where-Object { $_ -match '^GALLERY_DL_VERSION=' }
          $galleryVersion = ($line -split '=', 2)[1]
          Invoke-WebRequest "https://codeberg.org/mikf/gallery-dl/releases/download/v$galleryVersion/gallery-dl.exe" -OutFile dist/gallery-dl.exe
          $gallery = Get-Item dist/gallery-dl.exe
          if ($gallery.Length -lt 1MB -or $gallery.Length -gt 250MB) { throw "gallery-dl download is invalid" }
      - name: Detect signing credentials
        id: signing
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) { Write-Warning "Windows signing credentials are not configured; publishing unsigned artifacts." }
      - name: Sign executable
        if: steps.signing.outputs.available == 'true'
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "pictogrep-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD dist\pictogrep.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Build installer
        shell: pwsh
        run: |
          $env:PICTOGREP_VERSION = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Pinned runner image is missing Inno Setup 6" }
          & $iscc packaging\windows\pictogrep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer
        if: steps.signing.outputs.available == 'true'
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "pictogrep-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD dist\pictogrep-windows-x86_64-setup.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test clean install and launch
        shell: pwsh
        run: |
          $installer = Resolve-Path dist\pictogrep-windows-x86_64-setup.exe
          $installed = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Pictogrep\pictogrep.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable was not found" }
          $env:PICTOGREP_HOME = Join-Path $env:RUNNER_TEMP "pictogrep-smoke"
          $env:BROWSER = "cmd /c echo"
          $process = Start-Process $exe -PassThru
          try {
            $state = $null
            1..30 | ForEach-Object {
              try { $state = Invoke-RestMethod "http://127.0.0.1:8765/api/app/state" } catch { Start-Sleep -Milliseconds 250 }
              if ($state) { return }
            }
            if (-not $state.ok -or -not $state.aiAvailable) { throw "Installed app API did not start" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/pictogrep-windows-x86_64-setup.exe

  notes:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## Download"
            echo
            echo "**Windows** — [pictogrep-windows-x86_64-setup.exe](${BASE}/pictogrep-windows-x86_64-setup.exe)"
            echo "Double-click the installer, then open Pictogrep from the Start menu."
            echo
            echo "**Linux, Intel or AMD** — [pictogrep-linux-x86_64.tar.gz](${BASE}/pictogrep-linux-x86_64.tar.gz)"
            echo "**Linux, ARM** — [pictogrep-linux-arm64.tar.gz](${BASE}/pictogrep-linux-arm64.tar.gz)"
            echo "Extract the archive and run \`pictogrep\`. Nothing else is needed."
            echo
            echo "The remaining files on this page are the bare binaries Pictogrep downloads when it updates itself, and their checksums. You do not need to click them."
            echo
            echo "## What changed"
            echo
            awk -v version="## ${VERSION} " '
              index($0, version) == 1 { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
