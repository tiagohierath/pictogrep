name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - goarch: amd64
            archive_arch: x86_64
          - goarch: arm64
            archive_arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false
      - name: Build static binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/pictogrep .
          tar -C dist -czf pictogrep-linux-${{ matrix.archive_arch }}.tar.gz pictogrep
      - uses: softprops/action-gh-release@v3
        with:
          files: pictogrep-linux-${{ matrix.archive_arch }}.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false
      - name: Build GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          $version = "${{ github.ref_name }}".TrimStart("v")
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.version=$version" -o dist/pictogrep.exe .
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:PICTOGREP_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\pictogrep.iss
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/pictogrep-windows-x86_64-setup.exe
