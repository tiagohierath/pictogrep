name: Check

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Validate browser AI module
        if: runner.os == 'Linux'
        run: node scripts/check-browser-ai.mjs
      - name: Browser smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          test -n "$browser"
          PICTOGREP_BROWSER="$browser" go test -run '^TestBrowserSmoke$'
      - name: Cross-build release binaries
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/pictogrep-linux-x86_64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/pictogrep-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui" -o /tmp/pictogrep-windows-x86_64.exe .
